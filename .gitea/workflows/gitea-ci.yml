on: [push]

jobs:
    Format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: "latest"  
            - name: Install dependencies 
              run:  |
                npm install prettier
            - name: Check working directory
              run: pwd
            - name: Format
              run: |
                npm run format
